<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        .sidebar {
            height: 100vh;
            background: #343a40;
            color: white;
            position: fixed;
            width: 220px;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 12px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #495057;
        }

        .content {
            margin-left: 220px;
            padding: 20px;
        }

        .topbar {
            background: #212529;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-center mt-3">My App</h4>

    {% for item in items %}
        <a href="#">{{ item.name }}</a>
    {% endfor %}
</div>

<!-- Content Area -->
<div class="content">

    <!-- Topbar -->
    <div class="topbar d-flex justify-content-between">
        <span>Welcome {{ request.user.username }}</span>
        <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
    </div>

    <hr>

    {% block content %}{% endblock %}

</div>

</body>
</html>
