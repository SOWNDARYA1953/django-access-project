{% extends 'base.html' %}

{% block content %}

<h2>Admin Dashboard</h2>

<div class="row">
    {% for item in items %}
        <div class="col-md-4">
            <div class="card p-3 shadow mb-3">
                <h5>{{ item.name }}</h5>
                <p>{{ item.description }}</p>
            </div>
        </div>
    {% endfor %}
</div>

{% endblock %}
